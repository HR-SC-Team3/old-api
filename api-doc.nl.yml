                "403":
                    $ref: "#/components/responses/Forbidden"
        post:
            tags:
                - transfers
            summary: Een batchtransfer inplannen
            description: |-
                De server zet transfer_status op "Scheduled", ongeacht de request-
                body, en plaatst een notificatie in de wachtrij.

                Bekende problemen:
                - Geen validatie van velden, types of foreign keys, en geen uniciteitscontrole op id
                - Een ontbrekend id geeft 500 (de notificatie crasht erop) maar de rij is
                  dan al opgeslagen, waardoor elke GET /transfers daarna 500 geeft
                  totdat de rij handmatig wordt verwijderd
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TransferInput"
