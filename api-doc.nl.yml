# @format

openapi: 3.0.3
info:
    title: Voorraadbeheer-API
    description: >-
        REST-API bovenop een Python-stdlib HTTP-server met platte JSON-bestanden als opslag (zie
        /data). Elke route vereist een API_KEY-header; toegang wordt verder per
        resource en HTTP-methode begrensd door de endpoint_access-rechten van die sleutel (zie
        auth_provider.has_access). Gereconstrueerd uit api/main.py, api/models,
        api/providers en de voorbeeldbestanden /data/*.json, en gecontroleerd tegen
        elke gedocumenteerde route tijdens een live run van de server.
    version: 1.0.0
servers:
    - url: http://localhost:3000/api/v1
security:
    - ApiKeyAuth: []
tags:
    - name: warehouses
    - name: locations
    - name: items
    - name: item_lines
    - name: item_groups
    - name: item_types
    - name: inventories
    - name: suppliers
    - name: orders
    - name: clients
    - name: shipments
    - name: transfers
paths:
    /warehouses:
        get:
            tags:
                - warehouses
            summary: Magazijnen ophalen
            description: |-
                Bekende problemen:
                - Geen ondersteuning voor queryparameters
                - Queryparameters geven 403, ook mét toestemming
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Warehouse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        post:
            tags:
                - warehouses
            summary: Een magazijn aanmaken
            description: |-
                Bekende problemen:
                - Geen validatiecontroles
                - Lege payloads worden geaccepteerd
                - Ongeldige veldtypes worden geaccepteerd
                - Dubbele magazijn-id's worden geaccepteerd
                - Het content-type text/plain wordt geaccepteerd
                - Misvormde JSON geeft 500
                - Bij 201 wordt een lege body teruggegeven
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/WarehouseInput"
            responses:
                "201":
                    description: Aangemaakt
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /warehouses/{id}:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - warehouses
            summary: Een magazijn ophalen
            description: |-
                Bekende problemen:
                - Geeft 200 voor niet-bestaande id's
                - Misvormde id's geven 500
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Warehouse"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        put:
            tags:
                - warehouses
            summary: Een magazijn vervangen
            description: |-
                Bekende problemen:
                - Niet-bestaand id geeft 200
                - Misvormd id geeft 500
                - Geen validatiecontroles
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/WarehouseInput"
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        delete:
            tags:
                - warehouses
            summary: Een magazijn verwijderen
            description: |-
                Bekende problemen:
                - Niet-bestaand id geeft 200
                - Misvormd id geeft 500
                - Opnieuw verwijderen geeft 200
                - Verwijderen wordt niet permanent opgeslagen
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /warehouses/{id}/locations:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - warehouses
                - locations
            summary: Locaties binnen een magazijn ophalen
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Location"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /locations:
        get:
            tags:
                - locations
            summary: Locaties ophalen
            description: |-
                Bekende problemen:
                - Geen ondersteuning voor queryparameters
                - geeft 403, ook mét toestemming
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Location"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        post:
            tags:
                - locations
            summary: Een locatie aanmaken
            description: |-
                Bekende problemen:
                - Geen validatiecontroles
                - bij 201 wordt een lege body of geen header teruggegeven
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LocationInput"
            responses:
                "201":
                    description: Aangemaakt
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /locations/{id}:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - locations
            summary: Een locatie ophalen
            description: |-
                Bekende problemen:
                - Geeft 200 voor niet-bestaande id's
                - Misvormde id's geven 500
                - Interne lekken geven 200 en 500
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Location"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        put:
            tags:
                - locations
            summary: Een locatie vervangen
            description: |-
                Bekende problemen:
                - niet-bestaand id geeft 200
                - misvormd id geeft 500
                - geen validatiecontroles
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/LocationInput"
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        delete:
            tags:
                - locations
            summary: Een locatie verwijderen
            description:  |-
                Bekende problemen:
                - niet-bestaand id geeft 200
                - opnieuw verwijderen geeft 200
                - Get geeft geen 404
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /items:
        get:
            tags:
                - items
            summary: Artikelen ophalen
            description: |-
                Bekende problemen:
                - Geen ondersteuning voor queryparameters
                - Queryparameters geven 403, ook mét toestemming
                - Geen ondersteuning voor filteren op supplier_id
                - Geen ondersteuning voor filteren op item_group_id
                - Foutresponses gebruiken niet hetzelfde JSON-schema als succesvolle responses
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Item"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        post:
            tags:
                - items
            summary: Een artikel aanmaken
            description: |-
                Bekende problemen:
                - Geen validatiecontroles
                - Lege payloads worden geaccepteerd
                - Ongeldige veldtypes worden geaccepteerd
                - Dubbele artikel-id's worden geaccepteerd
                - Ongeldige foreign keys worden geaccepteerd
                - Het content-type text/plain wordt geaccepteerd
                - Misvormde JSON geeft 500
                - Bij 201 wordt een lege body teruggegeven
                - Bij 201 wordt geen Location-header teruggegeven
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ItemInput"
            responses:
                "201":
                    description: Aangemaakt
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /items/{id}:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - items
            summary: Een artikel ophalen
            description: |-
                Bekende problemen:
                - Geeft 200 voor niet-bestaande id's
                - Misvormde id's geven 500
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Item"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        put:
            tags:
                - items
            summary: Een artikel vervangen
            description: |-
                Bekende problemen:
                - Niet-bestaand id geeft 500
                - Misvormd id geeft 500
                - Ongeldige veldtypes worden geaccepteerd
                - Ongeldige foreign keys worden geaccepteerd
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/ItemInput"
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        delete:
            tags:
                - items
            summary: Een artikel verwijderen
            description: |-
                Bekende problemen:
                - Een verwijderd artikel kan nog steeds met 200 worden opgehaald
                - Niet-bestaand id geeft 200
                - Misvormd id geeft 200
                - Opnieuw verwijderen geeft 200
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /items/{id}/inventory:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - items
                - inventories
            summary: Voorraadrijen van een artikel ophalen, over alle locaties
            description: |-
                Bekende problemen:
                - Geeft 200 voor een niet-bestaand artikel in plaats van 404
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Inventory"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /items/{id}/inventory/totals:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - items
                - inventories
            summary: Opgetelde voorraadhoeveelheden van een artikel, over alle locaties
            description: |-
                Bekende problemen:
                - Geeft 200 voor een niet-bestaand artikel in plaats van 404
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/InventoryTotals"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /item_lines:
        get:
            tags:
                - item_lines
            summary: Artikellijnen ophalen
            description: |-
                Bekende problemen:
                - Queryparameters worden niet ondersteund.
                - Filteren op naam wordt niet ondersteund.
                - Filteren op beschrijving wordt niet ondersteund.
                - Sorteren wordt niet ondersteund.
                - Filteren geeft niet de verwachte lege resultatenset terug.
                - Foutresponses gebruiken niet hetzelfde JSON-schema als succesvolle responses.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/TaxonomyEntry"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        post:
            tags:
                - item_lines
            summary: Een artikellijn aanmaken
            description: |-
                Bekende problemen:
                - Geen validatie voor ontbrekende verplichte velden.
                - Ongeldige veldtypes worden geaccepteerd.
                - Dubbele artikellijn-id's worden geaccepteerd.
                - Content van het type text/plain wordt geaccepteerd.
                - Misvormde JSON geeft 500 in plaats van 400.
                - De response geeft 201 met een lege body.
                - De response bevat geen Location-header en geen aangemaakte resource.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaxonomyEntryInput"
            responses:
                "201":
                    description: Aangemaakt
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /item_lines/{id}:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - item_lines
            summary: Een artikellijn ophalen
            description: |-
                Bekende problemen:
                - Een niet-bestaand artikellijn-id geeft 200 in plaats van 404.
                - Een misvormd artikellijn-id geeft 500 in plaats van 400.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaxonomyEntry"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        put:
            tags:
                - item_lines
            summary: Een artikellijn vervangen
            description: |-
                Bekende problemen:
                - Een niet-bestaand artikellijn-id geeft 200 in plaats van 404.
                - Een misvormd artikellijn-id geeft 500 in plaats van 400.
                - Ongeldige veldtypes worden geaccepteerd.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaxonomyEntryInput"
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        delete:
            tags:
                - item_lines
            summary: Een artikellijn verwijderen
            description: |-
                Bekende problemen:
                - Een verwijderde artikellijn kan nog steeds met GET worden opgehaald.
                - Het verwijderen van een niet-bestaande artikellijn geeft 200 in plaats van 404.
                - Het verwijderen van een artikellijn met een misvormd id geeft 200 in plaats van 400.
                - Herhaald verwijderen van een artikellijn geeft 200 in plaats van 404.
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /item_lines/{id}/items:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - item_lines
                - items
            summary: Artikel-id's ophalen die bij deze artikellijn horen
            description: |-
                Bekende problemen:
                - Een niet-bestaand artikellijn-id geeft 200 in plaats van 404.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: integer
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /item_groups:
        get:
            tags:
                - item_groups
            summary: Artikelgroepen ophalen
            description: |-
                Bekende problemen:
                - Elke querystring geeft 403 voor iedereen, ook met geldige rechten
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/TaxonomyEntry"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        post:
            tags:
                - item_groups
            summary: Een artikelgroep aanmaken
            description: |-
                Bekende problemen:
                - Geen datavalidatie, elke vorm wordt geaccepteerd en opgeslagen
                - Een ontbrekend id wordt geaccepteerd en opgeslagen; elke latere opzoeking die tot het einde moet scannen (bijv. een onbekend id) laat de app dan crashen
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaxonomyEntryInput"
            responses:
                "201":
                    description: Aangemaakt
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /item_groups/{id}:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - item_groups
            summary: Een artikelgroep ophalen
            description: |-
                Bekende problemen:
                - Een niet-numeriek id laat de app crashen
                - Een niet-bestaand id geeft 200 met null
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaxonomyEntry"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        put:
            tags:
                - item_groups
            summary: Een artikelgroep vervangen
            description: |-
                Bekende problemen:
                - Geen validatie, een record wordt hoe dan ook vervangen
                - Een niet-numeriek id laat de app crashen
                - Geen bestaanscontrole, een onbekend id geeft geen 404
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaxonomyEntryInput"
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        delete:
            tags:
                - item_groups
            summary: Een artikelgroep verwijderen
            description: |-
                Bekende problemen:
                - Een niet-numeriek id laat de app crashen
                - Geen bestaanscontrole, een onbekend id geeft 200 zonder iets te doen
                - Artikelen die nog naar de groep verwijzen worden niet geblokkeerd of bijgewerkt, ze houden een hangend item_group_id
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /item_groups/{id}/items:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - item_groups
                - items
            summary: Artikel-id's ophalen die bij deze artikelgroep horen
            description: |-
                Bekende problemen:
                - Een niet-numeriek id laat de app crashen
                - Een niet-bestaand id geeft 200 met een lege lijst
                - Geeft kale artikel-id's terug, in tegenstelling tot GET /suppliers/{id}/items dat volledige Item-objecten teruggeeft
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: integer
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
    /item_types:
        get:
            tags:
                - item_types
            summary: Artikeltypes ophalen
            description: |-
                Bekende problemen:
                - Elke querystring geeft 403, ook met geldige rechten
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/TaxonomyEntry"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        post:
            tags:
                - item_types
            summary: Een artikeltype aanmaken
            description: |-
                Bekende problemen:
                - Geen validatie van velden of types
                - Geen uniciteitscontrole op id
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaxonomyEntryInput"
            responses:
                "201":
                    description: Aangemaakt
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"

    /item_types/{id}:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - item_types
            summary: Een artikeltype ophalen
            description: |-
                Bekende problemen:
                - Een niet-numeriek id laat de app crashen
                - Een niet-bestaand id geeft 200 met null
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/TaxonomyEntry"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        put:
            tags:
                - item_types
            summary: Een artikeltype vervangen
            description: |-
                Bekende problemen:
                - Een niet-numeriek id laat de app crashen
                - Een niet-bestaand id geeft 200
                - Geen validatie van velden of types
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaxonomyEntryInput"
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
        delete:
            tags:
                - item_types
            summary: Een artikeltype verwijderen
            description: |-
                Bekende problemen:
                - Een niet-numeriek id laat de app crashen
                - Een niet-bestaand id geeft 200 zonder iets te doen
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"

    /item_types/{id}/items:
        parameters:
            - $ref: "#/components/parameters/IdPathParam"
        get:
            tags:
                - item_types
                - items
            summary: Artikel-id's van dit artikeltype ophalen
            description: |-
                Bekende problemen:
                - Een niet-numeriek id laat de app crashen
                - Een niet-bestaand id geeft 200 met een lege lijst
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: integer
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"

    /inventories:
        get:
            tags:
                - inventories
            summary: Geeft alle voorraadrijen terug
            description: |-
                Bekende problemen:
                - Geen ondersteuning voor queryparameters
                - lege resultaten geven geen 404
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Inventory"
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
