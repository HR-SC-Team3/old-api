            - $ref: "#/components/parameters/IdPathParam"
        put:
            tags:
                - transfers
            summary: Een ingeplande transfer doorvoeren
            description: |-
                Verplaatst quantity_on_hand voor elke regel van from_location_id naar
                to_location_id (en maakt de voorraadrij op de bestemming aan als die niet
                bestaat), zet transfer_status op "Processed" en plaatst een notificatie.
                Neemt geen request-body aan.

                Bekende problemen:
                - Niet idempotent, de regels van de transfer worden nooit gewist. Een al
                  verwerkte transfer opnieuw doorvoeren verplaatst de voorraad opnieuw en telt
                  quantity_on_hand op de bestemming dubbel
                - Een niet-numeriek id laat de app crashen
                - Een niet-bestaand id laat de app crashen
            responses:
                "200":
                    description: OK
                "401":
                    $ref: "#/components/responses/Unauthorized"
                "403":
                    $ref: "#/components/responses/Forbidden"
components:
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            in: header
            name: API_KEY
            description: >-
                Wordt opgezocht in /data/user.json via auth_provider.get_user(); de
                endpoint_access-map van de gevonden gebruiker bepaalt vervolgens per resource+methode de toegang via
                auth_provider.has_access().
    parameters:
        IdPathParam:
            name: id
            in: path
            required: true
            schema:
                type: integer
            description: Surrogaat-id van de resource.
    responses:
        Unauthorized:
            description: Ontbrekende of onbekende API_KEY-header.
        Forbidden:
            description: >-
                De API-sleutel is geldig, maar de endpoint_access staat deze
                resource/methode niet toe.
    schemas:
        Warehouse:
            type: object
            properties:
                id:
                    type: integer
                code:
                    type: string
                name:
                    type: string
                address:
                    type: string
                city:
                    type: string
                zip_code:
                    type: string
                province:
                    type: string
                country:
                    type: string
                contact_name:
                    type: string
                contact_phone:
                    type: string
                contact_email:
                    type: string
                    format: email
                created_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time
        WarehouseInput:
            type: object
            properties:
                id:
                    type: integer
