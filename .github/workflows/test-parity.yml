name: Check resource test parity

on:
  push:
    branches:
      - main
    paths:
      - "tests/integration/test_*.py"
      - "scripts/check_test_parity.py"
  pull_request:
    paths:
      - "tests/integration/test_*.py"
      - "scripts/check_test_parity.py"

jobs:
  check-test-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that every resource's test file covers the same test types
        run: python scripts/check_test_parity.py
